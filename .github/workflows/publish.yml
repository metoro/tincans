# Stages a release on npm when a version tag (v1.2.3) is pushed.
#
# Uses npm trusted publishing: npm checks with GitHub that this workflow, in
# this repository, made the release, so no npm token is stored anywhere, and
# npm attaches a provenance statement linking the package to this commit.
# The release is staged, not published: it goes live only when a maintainer
# approves it on npmjs.com (Staged Packages) with two-factor authentication.
# Set up once on npmjs.com: package tincans > Settings > Trusted publisher >
# GitHub Actions, repository metoro/tincans, workflow publish.yml, environment
# npm, with "Allow npm publish" left unticked (staging only).
name: Stage a release on npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this run came from this repository

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later (and Node 22.14 or later).
      - run: npm install -g npm@latest

      - name: Tag matches package version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi

      - name: The client runs
        run: |
          node --check tincans.mjs
          TINCANS_HOME="$(mktemp -d)" node tincans.mjs new --no-join | head -1 | grep -q '^https://tincans.cc/#'

      - name: Stage the release (a maintainer approves it on npmjs.com)
        run: npm stage publish --provenance --access public
